# Shared I2C bus used by ICM-20948 and ADS1015.
i2c_device: /dev/i2c-2

imu_address: 0x69
# The current Cubie A7Z TWI driver does not recover cleanly when the breakout's
# internal AK09916 fails to ACK in bypass mode. Accel/gyro remain fully usable.
enable_magnetometer: false
require_magnetometer: false
# Accel/gyro output-axis i reads input-axis imu_axis_map[i], multiplied by
# imu_axis_sign[i]. Crobat's body/laboratory convention reverses sensor Y.
imu_axis_map: [0, 1, 2]
imu_axis_sign: [1.0, -1.0, 1.0]
# The ICM-20948's internal AK09916 needs the additional Z reversal used by
# spinal. Its Y also follows the Crobat body-frame reversal above.
mag_axis_map: [0, 1, 2]
mag_axis_sign: [1.0, -1.0, -1.0]
accel_bias: [0.0, 0.0, 0.0]  # m/s^2, after axis mapping
gyro_bias: [0.0, 0.0, 0.0]  # rad/s, after axis mapping
mag_bias: [0.0, 0.0, 0.0]   # tesla, after axis mapping
mag_scale: [1.0, 1.0, 1.0]

adc_address: 0x48
adc_channel: 0
# (R_top + R_bottom) / R_bottom. 100k/10k gives 11.0.
voltage_divider_ratio: 11.0
# If positive, overrides divider_ratio and means battery volts / ADC count.
adc_scale: 0.0121  # Calibrated battery volts per ADS1015 count
voltage_read_rate_hz: 50.0
voltage_filter_alpha: 0.01

# DShot300 requires four independent SPI controllers/MOSI pins. Enable the
# required pinmux overlays and list the resulting devices in motor order.
dshot_spi_devices: [/dev/spidev1.0, /dev/spidev2.0, /dev/spidev3.0, /dev/spidev5.0]
# Example only; do not copy until the device-to-pin mapping is verified:
# dshot_spi_devices: [/dev/spidev0.0, /dev/spidev1.0,
#                     /dev/spidev2.0, /dev/spidev3.0]
# Five packed SPI bits encode each DShot bit. At 1.6 MHz, 0=11000 and
# 1=11110 give the nominal 1.25 us / 2.50 us DShot300 high times. Each SPI
# transfer starts with a low byte so its first pulse is not stretched while
# the controller starts SCLK. This setting was verified with Bluejay 0.19.2.
dshot_spi_speed_hz: 1600000
# Absolute runtime direction for DShot ports 1..4. Bluejay command 7 selects
# normal and command 8 selects reversed; no ESC EEPROM write is performed.
dshot_reversed: [false, true, false, true]
require_all_dshot_channels: false

# Conventional PWM output ports 5..8. Verify numbering under
# /sys/class/pwm after installing the Cubie A7Z overlays.
pwm_chips: [10, 10, 10, 10]
pwm_channels: [0, 3, 4, 5]
pwm_frequency_hz: 500.0
# Crobat's extra_servo_cmd uses spinal indices 4..7 and angle values 0..180.
# These become normalized PWM duty values on physical ports 5..8.
pwm_angle_range: 180.0
pwm_initial_duty: [0.5, 0.5, 0.5, 0.5]

control_rate_hz: 500.0
imu_timeout: 0.1
